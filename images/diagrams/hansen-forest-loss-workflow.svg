<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" role="img"
     aria-labelledby="t d" style="width:100%;height:auto;color:inherit">
  <title id="t">Hansen tree-cover loss workflow</title>
  <desc id="d">Hansen Global Forest Change is loaded and its loss-year band masked to pixels with
  detected tree-cover loss, then clipped to a region of interest to give an annual loss map for
  2001 to 2023. Pixel area is converted from square metres to hectares and summed for each Hansen
  loss-year code, producing annual statistics, a cumulative running total, and GeoTIFF and CSV
  exports.</desc>
  <defs>
    <marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="4" y="10" width="266" height="66" rx="4"/>
    <rect x="330" y="10" width="240" height="66" rx="4"/>
    <rect x="630" y="10" width="286" height="66" rx="4"/>
    <rect x="4" y="150" width="266" height="66" rx="4"/>
    <rect x="330" y="150" width="240" height="66" rx="4"/>
    <rect x="630" y="150" width="286" height="66" rx="4"/>
    <rect x="4" y="290" width="266" height="66" rx="4"/>
    <rect x="330" y="290" width="240" height="66" rx="4"/>
    <rect x="630" y="290" width="286" height="66" rx="4"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#hr)" fill="none">
    <path d="M270 43 L326 43"/>
    <path d="M570 43 L626 43"/>
    <path d="M773 76 L773 113 L137 113 L137 146"/>
    <path d="M270 183 L326 183"/>
    <path d="M570 183 L626 183"/>
    <path d="M773 216 L773 253 L137 253 L137 286"/>
    <path d="M270 323 L326 323"/>
    <path d="M570 323 L626 323"/>
  </g>
  <g fill="currentColor" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
     font-size="12.5" text-anchor="middle">
    <text x="137" y="30" font-weight="600">Hansen Global Forest Change</text>
    <text x="137" y="48" font-size="10.5">UMD/hansen/global_forest_change_2023_v1_11</text><text x="137" y="66">treecover2000 · loss · lossyear</text>
    <text x="450" y="36" font-weight="600">Loss-year mask</text>
    <text x="450" y="56">pixels without detected<tspan x="450" dy="16">tree-cover loss removed</tspan></text>
    <text x="773" y="36" font-weight="600">Region of interest</text>
    <text x="773" y="56">loss-year layer clipped<tspan x="773" dy="16">to the supplied ROI</tspan></text>
    <text x="137" y="176" font-weight="600">Annual loss map</text>
    <text x="137" y="196">year of tree-cover loss<tspan x="137" dy="16">2001–2023 (codes 1–23)</tspan></text>
    <text x="450" y="176" font-weight="600">Pixel area in hectares</text>
    <text x="450" y="196">ee.Image.pixelArea()<tspan x="450" dy="16">square metres ÷ 10,000</tspan></text>
    <text x="773" y="176" font-weight="600">Annual aggregation</text>
    <text x="773" y="196">area summed inside the ROI<tspan x="773" dy="16">for each loss-year code</tspan></text>
    <text x="137" y="316" font-weight="600">Annual trend</text>
    <text x="137" y="336">annual statistics,<tspan x="137" dy="16">bar and line charts</tspan></text>
    <text x="450" y="316" font-weight="600">Cumulative loss</text>
    <text x="450" y="336">total 2001–2023 and<tspan x="450" dy="16">running cumulative area</tspan></text>
    <text x="773" y="316" font-weight="600">Exports</text>
    <text x="773" y="336">loss-year GeoTIFF,<tspan x="773" dy="16">annual CSV, cumulative CSV</tspan></text>
  </g>
</svg>
