<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" role="img"
     aria-labelledby="t d" style="width:100%;height:auto;color:inherit">
  <title id="t">Peatland land-use change and policy workflow</title>
  <desc id="d">Landsat 5 TM and Landsat 8 OLI surface reflectance from 1990 to 2020 is cloud-masked
  and reduced to median composites, then classified by Random Forest in Google Earth Engine into
  seven land-cover classes across 26 models, producing multi-temporal land-cover maps and
  forest-change trajectories. Those are overlaid with shallow and deep peat-depth information and
  compared against a chronology of 130 peatland regulations.</desc>
  <defs>
    <marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="4" y="10" width="262" height="66" rx="4"/>
    <rect x="326" y="10" width="248" height="66" rx="4"/>
    <rect x="634" y="10" width="282" height="66" rx="4"/>
    <rect x="4" y="150" width="262" height="66" rx="4"/>
    <rect x="326" y="150" width="248" height="66" rx="4"/>
    <rect x="634" y="150" width="282" height="66" rx="4"/>
    <rect x="80" y="290" width="760" height="66" rx="4"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#pr)" fill="none">
    <path d="M266 43 L322 43"/>
    <path d="M574 43 L630 43"/>
    <path d="M775 76 L775 113 L135 113 L135 146"/>
    <path d="M135 216 L135 286"/>
    <path d="M450 216 L450 286"/>
    <path d="M775 216 L775 286"/>
  </g>
  <g fill="currentColor" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
     font-size="12.5" text-anchor="middle">
    <text x="135" y="32" font-weight="600">Landsat 1990–2020</text>
    <text x="135" y="50">Landsat 5 TM · Landsat 8 OLI<tspan x="135" dy="16">surface reflectance, ~5-year steps</tspan></text>
    <text x="450" y="32" font-weight="600">Preprocessing</text>
    <text x="450" y="50">QA_PIXEL / CFMask cloud mask<tspan x="450" dy="16">median composite per step</tspan></text>
    <text x="775" y="32" font-weight="600">Random Forest classification</text>
    <text x="775" y="50">Google Earth Engine · 7 classes<tspan x="775" dy="16">26 models</tspan></text>
    <text x="135" y="172" font-weight="600">Multi-temporal LULC</text>
    <text x="135" y="190">land-cover maps and<tspan x="135" dy="16">forest-area change</tspan></text>
    <text x="450" y="172" font-weight="600">Peat-depth information</text>
    <text x="450" y="190">shallow &lt;3 m<tspan x="450" dy="16">deep &gt;3 m</tspan></text>
    <text x="775" y="172" font-weight="600">Policy chronology</text>
    <text x="775" y="190">inventory of 130<tspan x="775" dy="16">peatland regulations</tspan></text>
    <text x="460" y="316" font-weight="600">Comparison</text>
    <text x="460" y="336">landscape change trajectories read against peat depth<tspan x="460" dy="16">and the chronology of regulation</tspan></text>
  </g>
</svg>
