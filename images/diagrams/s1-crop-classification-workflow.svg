<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img"
     aria-labelledby="t d" style="width:100%;height:auto;color:inherit">
  <title id="t">Sentinel-1 object-based crop classification workflow</title>
  <desc id="d">Sentinel-1 GRD scenes are filtered to IW mode with VV and VH polarisation over a
  region of interest, split into three periods of 2023, averaged separately for ascending and
  descending orbits, then combined into temporal composites. VV and VH stacks feed a seasonal RGB
  visualisation and a SNIC segmentation of the VV stack, from which object-level mean VV values are
  derived. Crop and non-crop training points train a Random Forest of 50 trees, producing a binary
  crop / non-crop classification.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="4" y="10" width="200" height="62" rx="4"/>
    <rect x="236" y="10" width="200" height="62" rx="4"/>
    <rect x="468" y="10" width="200" height="62" rx="4"/>
    <rect x="700" y="10" width="216" height="62" rx="4"/>
    <rect x="4" y="146" width="200" height="62" rx="4"/>
    <rect x="236" y="146" width="200" height="62" rx="4"/>
    <rect x="468" y="146" width="200" height="62" rx="4"/>
    <rect x="700" y="146" width="216" height="62" rx="4"/>
    <rect x="4" y="282" width="200" height="62" rx="4"/>
    <rect x="236" y="282" width="200" height="62" rx="4"/>
    <rect x="468" y="282" width="200" height="62" rx="4"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)" fill="none">
    <path d="M204 41 L232 41"/>
    <path d="M436 41 L464 41"/>
    <path d="M668 41 L696 41"/>
    <path d="M808 72 L808 105 L104 105 L104 142"/>
    <path d="M204 177 L232 177"/>
    <path d="M436 177 L464 177"/>
    <path d="M668 177 L696 177"/>
    <path d="M808 208 L808 241 L104 241 L104 278"/>
    <path d="M204 313 L232 313"/>
    <path d="M436 313 L464 313"/>
  </g>
  <g fill="currentColor" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
     font-size="12.5" text-anchor="middle">
    <text x="104" y="36">Sentinel-1 GRD<tspan x="104" dy="16">COPERNICUS/S1_GRD</tspan></text>
    <text x="336" y="30">Filter<tspan x="336" dy="16">IW mode, VV + VH</tspan><tspan x="336" dy="16">region of interest</tspan></text>
    <text x="568" y="30">Three periods, 2023<tspan x="568" dy="16">Jan–Apr · May–Aug</tspan><tspan x="568" dy="16">Sep–Dec</tspan></text>
    <text x="808" y="30">Per orbit direction<tspan x="808" dy="16">ascending and descending</tspan><tspan x="808" dy="16">temporal mean backscatter</tspan></text>
    <text x="104" y="166">Combined composites<tspan x="104" dy="16">ascending + descending</tspan></text>
    <text x="336" y="166">VV and VH temporal stacks<tspan x="336" dy="16">seasonal RGB visualisation</tspan></text>
    <text x="568" y="166">SNIC segmentation<tspan x="568" dy="16">on the VV stack</tspan></text>
    <text x="808" y="166">Object-level features<tspan x="808" dy="16">mean VV per object</tspan></text>
    <text x="104" y="310">Training points<tspan x="104" dy="16">crop / non-crop</tspan></text>
    <text x="336" y="310">Random Forest<tspan x="336" dy="16">50 trees</tspan></text>
    <text x="568" y="310">Crop / non-crop<tspan x="568" dy="16">classification</tspan></text>
  </g>
</svg>
