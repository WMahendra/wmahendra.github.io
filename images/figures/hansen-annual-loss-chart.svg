<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
     aria-labelledby="t d" style="width:100%;height:auto">
  <title id="t">Annual tree-cover loss, 2001-2023</title>
  <desc id="d">Bar chart of annual tree-cover loss in hectares for each year from 2001 to 2023,
  computed from the Hansen Global Forest Change loss-year band over the analysis extent within
  West Kalimantan. Values rise from about 8,800 hectares in 2001 to a maximum near 31,000
  hectares and stand at about 24,700 hectares in 2023.</desc>
  <style>
    .ax { font: 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5c666f; }
    .gl { stroke: #e3e7ea; stroke-width: 1; }
    .bar { fill: #17627a; }
    .lbl { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5c666f; }
  </style>
  <rect x="0" y="0" width="640" height="360" fill="#fff"/>
  <g class="gl"><line x1="62" y1="326.0" x2="626" y2="326.0"/><line x1="62" y1="229.8" x2="626" y2="229.8"/><line x1="62" y1="133.5" x2="626" y2="133.5"/><line x1="62" y1="37.2" x2="626" y2="37.2"/></g>
  <g><text class="ax" x="54" y="330.0" text-anchor="end">0</text><text class="ax" x="54" y="233.8" text-anchor="end">10,000</text><text class="ax" x="54" y="137.5" text-anchor="end">20,000</text><text class="ax" x="54" y="41.2" text-anchor="end">30,000</text></g>
  <g class="bar"><rect x="65.7" y="241.3" width="17.2" height="84.7"/><rect x="90.2" y="227.7" width="17.2" height="98.3"/><rect x="114.7" y="262.0" width="17.2" height="64.0"/><rect x="139.2" y="243.4" width="17.2" height="82.6"/><rect x="163.8" y="245.3" width="17.2" height="80.7"/><rect x="188.3" y="251.3" width="17.2" height="74.7"/><rect x="212.8" y="276.5" width="17.2" height="49.5"/><rect x="237.3" y="193.6" width="17.2" height="132.4"/><rect x="261.9" y="203.9" width="17.2" height="122.1"/><rect x="286.4" y="238.8" width="17.2" height="87.2"/><rect x="310.9" y="180.5" width="17.2" height="145.5"/><rect x="335.4" y="107.6" width="17.2" height="218.4"/><rect x="359.9" y="173.9" width="17.2" height="152.1"/><rect x="384.5" y="87.2" width="17.2" height="238.8"/><rect x="409.0" y="94.4" width="17.2" height="231.6"/><rect x="433.5" y="29.3" width="17.2" height="296.7"/><rect x="458.0" y="152.5" width="17.2" height="173.5"/><rect x="482.5" y="133.2" width="17.2" height="192.8"/><rect x="507.1" y="224.7" width="17.2" height="101.3"/><rect x="531.6" y="172.0" width="17.2" height="154.0"/><rect x="556.1" y="246.0" width="17.2" height="80.0"/><rect x="580.6" y="191.0" width="17.2" height="135.0"/><rect x="605.2" y="87.8" width="17.2" height="238.2"/></g>
  <g><text class="ax" x="74.3" y="344" text-anchor="middle">2001</text><text class="ax" x="196.9" y="344" text-anchor="middle">2006</text><text class="ax" x="319.5" y="344" text-anchor="middle">2011</text><text class="ax" x="442.1" y="344" text-anchor="middle">2016</text><text class="ax" x="564.7" y="344" text-anchor="middle">2021</text><text class="ax" x="613.7" y="344" text-anchor="middle">2023</text></g>
  <text class="lbl" x="62" y="356">Hectares of tree-cover loss per year, 2001-2023</text>
</svg>
