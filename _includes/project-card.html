{% include base_path %}
{% comment %} One entry in a projects listing: title, excerpt, year. {% endcomment %}
<div class="list__item">
  <article class="archive__item">
    <h2 class="archive__item-title" itemprop="headline">
      <a href="{{ base_path }}{{ post.url }}" rel="permalink">{{ post.title }}</a>
    </h2>
    {% if post.excerpt %}
      <p class="archive__item-excerpt">{{ post.excerpt | markdownify | strip_html | strip_newlines }}</p>
    {% endif %}
    {% if post.date %}
      <p class="page__meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y" }}</time></p>
    {% endif %}
  </article>
</div>
